[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logo-maker"
version = "0.1.0"
description = "Turn an idea, reference, or project into a judged, rendered 3D logo with a full export set. No AI image generation."
readme = "README.md"
# bpy (Blender as a Python module) ships cp313 wheels only.
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Nicolas Alexander" }]
keywords = ["logo", "brand", "blender", "3d", "svg", "favicon", "typesafe", "jev"]

dependencies = [
    # 3D
    "bpy==5.2.3",
    "sdf @ git+https://github.com/fogleman/sdf@d58a6fc63b75fc1cf1ebb71e0b42bf552319c8f1",
    "manifold3d>=3.5.4",
    "trimesh>=5.2.0",
    "shapely>=2.2.0",
    "pymeshlab>=2025.7.post1",
    "build123d>=0.13.0",
    "mitsuba>=3.9.1",
    "pyluxcore>=2.11.2",
    "numpy>=2.2",
    "scikit-image>=0.26.0",
    "meshio>=5.3.5",
    # 2D, type, color
    "fonttools>=4.68.0",
    "skia-pathops>=0.9.2",
    "drawsvg>=2.4.2",
    "resvg-py>=0.5.0",
    "pillow>=13.0.0",
    "vtracer>=0.6.15",
    "vpype>=1.15.0",
    "coloraide>=8.14.1",
    "OpenImageIO>=3.2.2.0",
    # jev transport, agent surface
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "tomlkit>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.2",
    "ruff==0.17.4",
    "ty==0.0.100",
]

[project.scripts]
logo-maker = "logo_maker.cli:main"

[tool.setuptools.packages.find]
include = ["logo_maker*"]

[tool.setuptools.package-data]
logo_maker = ["blender/*.py", "catalog/*.toml", "catalog/*.md"]

[tool.uv]
# bpy pins numpy; resolve for the one platform the GPU pipeline is verified on, plus Linux for CI.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: renders with Blender (slow; GPU or CPU). Deselect with -m 'not render'.",
    "live: calls the live jev API (needs OPENROUTER_API_KEY or TYPESAFE_API_KEY).",
]
addopts = "-m 'not live'"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["logo_maker", "tests", "scripts"]
[[tool.ty.overrides]]
include = ["logo_maker/blender/**", "scripts/validate_gpu.py"]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["bpy", "mathutils", "_cycles"]

[[tool.ty.overrides]]
include = ["logo_maker/renderers/luxcore.py"]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["pyluxcore"]

[[tool.ty.overrides]]
include = ["logo_maker/geometry.py"]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["pymeshlab"]


[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["js/node_modules", "logos", "benchmarks/refinement/evidence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S"]
# S603/S607: running external tools (blender, node, fontforge, primitive) by name is the design.
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["logo_maker"]
