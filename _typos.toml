[files]
# Research notes quote sources verbatim, typos included.
extend-exclude = ["docs/research", "benchmarks/omp/recipe", "benchmarks/refinement/review-followup/validation/publication-history-red-020e1d2.txt"]

[default]
# Revision IDs contain generated hexadecimal source hashes, not prose.
extend-ignore-re = ['\b[0-9]{4}-[0-9a-f]{12}-(?:preview|final)\b']

# False positives: established local-variable names.
[default.extend-identifiers]
pick_ba = "pick_ba"
ser_state = "ser_state"
ser_questions = "ser_questions"
vor = "vor"
threed = "threed"
PN = "PN"
PNGs = "PNGs"
# NumPy API retained in exact measured Python-source snapshots (.py.txt).
arange = "arange"
