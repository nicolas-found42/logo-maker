name: ci

# Offline checks only: no GPU, no jev key. The render tests run locally (`just render-example`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Lockfile is current
        run: uv lock --check
      - name: Install dev tools
        run: uv sync --locked --only-group dev
      - name: Ruff check
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .

  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: --all-files

  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # canvas@2.11.2 (via trianglify) has no Node 24 prebuild; npm ci compiles it against these.
      - name: Install node-canvas build libraries
        run: brew install pkgconf cairo pango libpng jpeg-turbo giflib librsvg pixman
      - name: Install npm packages
        run: npm ci --prefix js
      - name: Install Python packages
        run: uv sync --locked
      - name: Type check
        run: uv run --no-sync ty check
      - name: Offline tests
        run: uv run --no-sync python -m pytest -q -m "not render and not live"
