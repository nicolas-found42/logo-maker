name: template validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: templates-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-template:
    name: Validate PR template
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # This SHA is the trusted base/default branch, never the contributor's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate current body and publish template/pr on the current head SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/template_check.py --github

  issue-template:
    name: Validate issue template
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate current body and flag invalid issues as needs-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/template_check.py --github
