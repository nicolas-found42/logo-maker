name = "Skill Swap"
summary = "A private team workspace for reusable AI skills and plugins. Individual contributions become shared capability through a clear library, independent review and approved releases. The promise is: Your team's know-how, ready to use. The visual identity is warm and editorial. The dimensional logo MUST be built from layered heavyweight paper or card, with broad geometric pieces, controlled folds, substantial thickness, visible edges and restrained fiber texture. Explore three distinct territories: joined modules, a folded shared object, and parts framing an open shared space."
audience = "Teammates with mixed technical confidence, including newcomers discovering and using AI skills; Builders and trusted approvers maintain the shared library."
tone = ["approachable", "capable", "trustworthy", "warm", "precise"]
initials = "SS"
uses = ["login_hero", "brand_introduction", "favicon", "app_icon", "monochrome_mark"]
avoid = ["Any non-paper material including ceramic, porcelain, metal, rubber, glass, wax or clay", "Inflated toy shapes", "A badge, medallion, backing disc, enclosing border or backing plate", "Generic AI sparkles, chain links or recycling arrows", "Slack hashtag or Dropbox diamond-box topology", "Cohere cell cluster and Miro chevrons", "Existing leaf icon", "Fine text or hairline geometry inside the symbol", "Confusing peer-to-peer skill barter with a team AI skills library"]
intended_appearance = "Warm editorial layered heavyweight matte paper and card, controlled folds, visible substantial edges and restrained fiber texture"

[palette]
primary = "#285640"
secondary = "#DCE7D6"
accent = "#C47D5A"
highlight = "#F8F7F2"
background = "#F8F7F2"
ink = "#243B31"

[fonts]
display = "Manrope:wght=700"
text = "DM Sans:wght=400"

