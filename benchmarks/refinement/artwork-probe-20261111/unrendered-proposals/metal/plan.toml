schema = 1
requirements_revision = "999b01a47ef99e0f630e1fb69b931fc9d210e13246a230d32cd59ead706c24c6"
hypothesis = "A release becomes dependable when independent service supports lock through one explicit dependency key"
visual_mechanism = "Two tall blue steel uprights, each pierced by two round mounting bores, have horizontal arms directed toward the center. A broad copper hexagonal front plate covers their central junction. A copper rear lip and narrow waist peek out beneath it. Narrow chamfers outline the planar faces and the dark mounting bores. The connector is the explicit dependency between two independent service supports. Its hidden bearing contacts are described as physical construction, not as visible image evidence. The broad joined contour is shared with the flat SVG master. Blue #245064 steel and warm #B87E48 copper retain restrained satin reflections. No text or backing disc enters the symbol. Supplied Manrope 700 and DM Sans 400 serve adjacent naming and UI. The symbol is intended for dashboards, documentation and app icons."
requirement_ids = ["material", "meaning", "avoid_0", "avoid_1", "uses", "palette", "fonts", "tone"]
assumptions = ["These are authored alternatives for visual evaluation; owner artistic acceptance remains unknown"]

[[details]]
feature = "Double-shouldered copper dependency key"
purpose = "Make the central connector actually capture both independent support arms"
intended_scale = "Broad shared silhouette at app-icon size; bearing steps resolve in the hero"
construction = "The supported mesh recipe has three separate, closed solids. Steel rails occupy z=0.04 to 0.24 and slide inward from opposite x directions before mounting. Copper waist occupies z=0.04 to 0.24 inside receiver contours cut at a 0.012-unit transverse clearance. Its rear head occupies z=0 to 0.04 and expands the waist profile by 0.055; its front head occupies z=0.24 to 0.295 and expands the profile by 0.06. These shoulders overlap the rail arms and bear on their front and rear planes. Four 0.055-radius through mounting eyes fix the rails after assembly. Closed-mesh Boolean intersection tests return zero overlap volume. The front head conceals the internal contacts in the hero; a lower rear lip remains visible. This is a graphic mechanical dependency joint, not a claim about a load-rated manufactured assembly."
deletion_test = "Removing either retaining head leaves one direction of the joint uncaptured; removing the key separates the two independent supports."

[[details]]
feature = "Planar caps and machined bore lead-ins"
purpose = "Show coherent satin metal construction without diagonal patches across flat caps"
intended_scale = "Hero/native detail, secondary to the flat silhouette"
construction = "Flat cap faces meet explicit narrow chamfer strips and the straight walls of each solid. The through bores have annular lead-ins. All three mesh assets are closed and consistently wound. No downstream bevel modifier or averaged PLY vertex normals is used; the existing material, tangent, lighting and sampling remain fixed."
deletion_test = "Without the chamfers and bore lead-ins the material loses its machined edge behavior. Visible cap diagonals in the new render would disprove this repair."
