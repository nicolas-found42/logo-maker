# Lighting rigs: area-light recipes the Blender builder places per scene, plus a
# suggested HDRI strength. `description` is what jev reads. Energy is in watts,
# size is the area light's edge in scene units, locations are world coords.
[studio_soft]
description = "One large soft key with gentle fill, for calm product-like renders."
hdri_strength = 0.45
lights = [
  { name = "Key", type = "area", energy = 380.0, location = [-3.0, -2.5, 5.0], size = 3.0 },
  { name = "Rim", type = "area", energy = 300.0, location = [3.2, 3.2, 2.6], size = 2.5 },
  { name = "Fill", type = "area", energy = 60.0, location = [3.0, -4.0, 2.0], size = 6.0 },
]

[three_point]
description = "Classic key, fill, and rim trio with stronger modeling shadows."
hdri_strength = 0.35
lights = [
  { name = "Key", type = "area", energy = 500.0, location = [-3.5, -2.0, 4.5], size = 2.0 },
  { name = "Fill", type = "area", energy = 120.0, location = [3.5, -3.0, 2.0], size = 4.0 },
  { name = "Rim", type = "area", energy = 450.0, location = [2.5, 4.0, 3.5], size = 1.5 },
]

[raking]
description = "Low grazing light that throws relief and engraving into sharp relief."
hdri_strength = 0.25
lights = [
  { name = "Rake", type = "area", energy = 420.0, location = [-4.5, -0.5, 1.2], size = 2.0 },
  { name = "Fill", type = "area", energy = 50.0, location = [2.0, -3.0, 4.0], size = 5.0 },
  { name = "Rim", type = "area", energy = 200.0, location = [3.0, 3.5, 2.5], size = 2.0 },
]

[top_flat]
description = "Flat top light with almost no shadow, for toon and line-art looks."
hdri_strength = 0.6
lights = [
  { name = "Top", type = "area", energy = 350.0, location = [0.0, 0.0, 6.0], size = 5.0 },
  { name = "Fill", type = "area", energy = 150.0, location = [0.0, -4.0, 2.5], size = 4.0 },
]
