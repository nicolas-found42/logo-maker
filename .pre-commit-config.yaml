# Commit-stage hooks only: fast checks. ty and pytest run via `just check` and CI.
# Run with prek (https://github.com/j178/prek): `prek install`, or `prek run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1500]
        # Provenance-pinned full-resolution evidence and original CC0 environment.
        exclude: ^benchmarks/omp/(assets/.*\.png|recipe/poly_haven_studio_1k\.hdr)$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^benchmarks/(omp/(assets|recipe|qualification|validation/issue-2)/|refinement/(evidence/|(reconciliation|review-followup|ci-followup|artwork-probe-20261111|paper-exposure-20261111|current-concept-20261111)/(snapshots|validation)/))
      - id: trailing-whitespace
        exclude: ^benchmarks/(omp/(assets|recipe|qualification|validation/issue-2)/|refinement/(evidence/|(reconciliation|review-followup|ci-followup|artwork-probe-20261111|paper-exposure-20261111|current-concept-20261111)/(snapshots|validation)/))

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461  # frozen: v1.50.3
    hooks:
      - id: typos
        # Report only; the upstream default rewrites files and can break third-party identifiers.
        args: [--force-exclude]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 83cecb6b523a053d7d3dfdc4798d705b505a88f9  # frozen: v0.2.78
    hooks:
      - id: rumdl
