# Commit-stage and pre-push hooks. Install with `uvx prek install -t pre-commit -t pre-push`.
# Run commit-stage hooks over all files with `uvx prek run --all-files`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1500]
        # Provenance-pinned full-resolution evidence and original CC0 environment.
        exclude: ^benchmarks/omp/(assets/.*\.png|recipe/poly_haven_studio_1k\.hdr)$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^benchmarks/(omp/(assets|recipe|qualification|validation/issue-2)/|refinement/(evidence/|(reconciliation|review-followup|ci-followup|artwork-probe-20261111|paper-exposure-20261111|current-concept-20261111|deadline-persistence-20261111|deadline-concurrency-20261111)/(snapshots|validation)/))
      - id: trailing-whitespace
        exclude: ^benchmarks/(omp/(assets|recipe|qualification|validation/issue-2)/|refinement/(evidence/|(reconciliation|review-followup|ci-followup|artwork-probe-20261111|paper-exposure-20261111|current-concept-20261111|deadline-persistence-20261111|deadline-concurrency-20261111)/(snapshots|validation)/))

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461  # frozen: v1.50.3
    hooks:
      - id: typos
        # Report only; the upstream default rewrites files and can break third-party identifiers.
        args: [--force-exclude]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 83cecb6b523a053d7d3dfdc4798d705b505a88f9  # frozen: v0.2.78
    hooks:
      - id: rumdl

  - repo: local
    hooks:
      - id: uv-lock-check
        name: check uv.lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: skill-check
        name: check agent skills
        entry: uv run --no-sync python scripts/skill_check.py
        language: system
        pass_filenames: false
        files: ^(skills/.*|scripts/skill_check\.py)$
      - id: ty-check
        name: ty type check
        entry: uv run --no-sync ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: verify-refinement-evidence
        name: verify retained refinement evidence
        entry: uv run --no-sync python scripts/verify_reconciled_refinement.py
        language: system
        pass_filenames: false
        files: ^(logo_maker/|scripts/verify_reconciled_refinement\.py|benchmarks/refinement/)
      - id: pytest-offline
        name: offline pytest suite
        entry: env PAG_USE_LOCAL_REV=1 uv run --no-sync python -m pytest -q -m "not render and not live" -n auto --dist worksteal
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
